name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dx
          POSTGRES_PASSWORD: dx_ci_only
          POSTGRES_DB: dataexchange
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dx -d dataexchange"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://dx:dx_ci_only@localhost:5432/dataexchange?schema=public
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-jwt-secret-000000000000000000000000
      SHARE_CODE_PEPPER: ci-only-pepper-0000000000000000000000000000
      DATA_ENC_KEY: Y2ktb25seS1rZXktMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATA_ENC_KEY_ID: ci-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate and seed
        run: |
          pnpm -F api exec prisma migrate deploy
          pnpm -F api exec prisma db seed
      - name: API integration tests (separate _test database)
        run: pnpm -F api test:int
      - run: pnpm build

  e2e:
    # Playwright on main, or on PRs labelled "e2e" (PROMPT.md §17).
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dx
          POSTGRES_PASSWORD: dx_ci_only
          POSTGRES_DB: dataexchange
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dx -d dataexchange"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      CI: "true"
      DATABASE_URL: postgresql://dx:dx_ci_only@localhost:5432/dataexchange?schema=public
      APP_ORIGIN: http://localhost:3000
      API_ORIGIN: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      DEV_JWT_SECRET: ci-only-jwt-secret-000000000000000000000000
      SHARE_CODE_PEPPER: ci-only-pepper-0000000000000000000000000000
      DATA_ENC_KEY: Y2ktb25seS1rZXktMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DATA_ENC_KEY_ID: ci-1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F web exec playwright install --with-deps chromium
      - name: Migrate and seed
        run: |
          pnpm -F api exec prisma migrate deploy
          pnpm -F api exec prisma db seed
      - run: pnpm -F web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
