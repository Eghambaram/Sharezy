services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dx
      POSTGRES_PASSWORD: dx_local_only
      POSTGRES_DB: dataexchange
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dx -d dataexchange"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
